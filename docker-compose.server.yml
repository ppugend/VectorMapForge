services:
  tileserver:
    image: ghcr.io/vinayakkulkarni/tileserver-rs:latest
    container_name: vmf-tileserver
    expose:
      - "8080"
    volumes:
      - osm_persistent_data:/data:ro
    environment:
      - RUST_LOG=info
    command: ["./tileserver-rs", "/data"]
    restart: unless-stopped

  dashboard:
    image: oven/bun:1.1-alpine
    container_name: vmf-dashboard
    working_dir: /app
    ports:
      - "${PUBLIC_PORT:-8050}:3000"
      - "127.0.0.1:${ADMIN_PORT:-8051}:3001"
    volumes:
      - ./manager:/app
      - osm_persistent_data:/data
    environment:
      - NODE_ENV=production
      - DATA_DIR=/data
      - PUBLIC_PORT=3000
      - ADMIN_PORT=3001
      - TILESERVER_URL=http://tileserver:8080
      - BUILD_DISABLED=true
      # Optional fixed origin for URLs in style.json/TileJSON responses (e.g. https://tiles.example.com).
      # Leave unset in normal setups: the server derives the origin from the X-Forwarded-Proto/Host
      # headers that TLS-terminating proxies (Cloudflare Tunnel, Nginx Proxy Manager) send by default.
      # Set only if (a) the proxy does not forward those headers, so generated URLs come out as
      # http:// and clients hit mixed-content blocks, or (b) the server is reachable via multiple
      # hostnames and responses must always advertise one canonical domain. No trailing slash.
      - PUBLIC_URL=${PUBLIC_URL:-}
    command: sh -c "bun install && bun server.js"
    restart: unless-stopped

volumes:
  osm_persistent_data:
    name: osm_persistent_data
    driver: local
